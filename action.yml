name: "CodePulse Review"
description: "Trigger a CodePulse AI code review on this PR once CI completes. Requires the CodePulse GitHub App."
author: "CodePulse"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  api-url:
    description: "CodePulse API base URL. Override only for staging envs."
    required: false
    default: "https://codepulse.review"

runs:
  using: "composite"
  steps:
    - name: "Trigger CodePulse review"
      shell: bash
      env:
        CODEPULSE_API_URL: ${{ inputs.api-url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: ${{ github.action_path }}/trigger.sh
